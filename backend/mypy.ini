[mypy]
python_version = 3.12
plugins = pydantic.mypy
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_ignores = False
strict_optional = False
disable_error_code = var-annotated, import-untyped, attr-defined, assignment, arg-type, call-arg
exclude = (?x)(
    ^migrations/
    | ^seed/
    | dayforce_seed\.py
  )
