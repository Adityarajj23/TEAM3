[project]
name = "tracetest-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501", "UP038", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
strict_optional = false
plugins = ["pydantic.mypy"]
disable_error_code = ["var-annotated"]
exclude = ["migrations/", "tests/"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed/catalog.py"]
